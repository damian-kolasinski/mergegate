[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.2"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/damian-kolasinski/mergegate"
publish = false

[workspace.dependencies]
api = { path = "crates/api", package = "mergegate-api" }
# Not `core`: that name would shadow the language's own `core` crate.
mergegate-core = { path = "crates/core" }
git = { path = "crates/git", package = "mergegate-git" }
backend-github = { path = "crates/backend-github", package = "mergegate-backend-github" }
rules-toml = { path = "crates/rules-toml", package = "mergegate-rules-toml" }
store-sqlite = { path = "crates/store-sqlite", package = "mergegate-store-sqlite" }
highlight = { path = "crates/highlight", package = "mergegate-highlight" }
lang-release = { path = "crates/lang-release", package = "mergegate-lang-release" }
tailscale = { path = "crates/tailscale", package = "mergegate-tailscale" }
judge-command = { path = "crates/judge-command", package = "mergegate-judge-command" }
judge-jev = { path = "crates/judge-jev", package = "mergegate-judge-jev" }
hub = { path = "crates/hub", package = "mergegate-hub" }
skill = { path = "crates/skill", package = "mergegate-skill" }
testkit = { path = "crates/testkit", package = "mergegate-testkit" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
