[package]
name = "mergegate-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
api.workspace = true
backend-github.workspace = true
crc32fast = "1.5.2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query", "matched-path"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
git.workspace = true
highlight.workspace = true
lang-release.workspace = true
judge-command.workspace = true
judge-jev.workspace = true
skill.workspace = true
mergegate-core.workspace = true
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rules-toml.workspace = true
store-sqlite.workspace = true
tempfile = "3.27.0"
tailscale.workspace = true
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "signal", "macros", "sync", "time", "process", "io-util", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std"] }

[dev-dependencies]
zip = { version = "9.0.5", default-features = false }
