name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    # Rust only: without pnpm the hub embeds the stub UI, which is all clippy
    # needs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The tests drive the real UI; a stub build would fail them less clearly.
      MG_REQUIRE_UI: 1
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: cargo test --workspace --locked
      - name: Performance budgets
        # Shared macOS runners are too noisy to gate on; there they only report.
        env:
          MG_ENFORCE_BUDGETS: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
        run: cargo test --release --locked -p mg --test contract --test budgets -- --ignored --nocapture --test-threads=1

  langs:
    # Builds every language pack in langs/packs.json, checks that mg loads
    # and highlights with each, and keeps them for `mg lang add --from`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The tree-sitter CLI's wasi-sdk.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/tree-sitter
          key: tree-sitter-${{ hashFiles('langs/packs.json') }}
      - run: node langs/build.mjs --out langs/dist
      - env:
          MG_LANG_PACKS: ${{ github.workspace }}/langs/dist
        run: cargo test --locked -p mergegate-highlight --test languages -- --ignored
      - uses: actions/upload-artifact@v4
        with:
          name: language-packs
          path: langs/dist/*.tar.gz

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      # `pnpm typecheck` generates the API types with cargo, and `pnpm e2e`
      # builds the mg it tests, in release since it enforces the budgets.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: python3 ../appearance/generate.py --check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests and the UI budgets
        env:
          MG_ENFORCE_BUDGETS: 1
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report/

  ios:
    runs-on: macos-26
    # Pixel goldens require the same UIKit runtime and compiler as their baseline.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          working_directory: ios
      - name: Build and test the native client
        run: .claude/scripts/check.sh all ios
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-test-results
          path: ios/.build/DerivedData/Logs/Test/
