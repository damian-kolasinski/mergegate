name: Release

# A vX.Y.Z tag publishes a release: mg for every target, signed with
# packslip, and the language packs with their index. A pull request that
# changes how releases are built runs the builds without signing or
# publishing.

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - langs/**

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    # packslip takes the version from the tag, and a mismatch would publish
    # an mg reporting another version than the release it came in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches the workspace version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, but Cargo.toml has version $version" >&2
            exit 1
          fi

  langs:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.ref_type != 'tag'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node langs/build.mjs --out langs/dist
      # Only packs mg loads and highlights with ship.
      - env:
          MG_LANG_PACKS: ${{ github.workspace }}/langs/dist
        run: cargo test --locked -p mergegate-highlight --test languages -- --ignored
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: languages
          path: |
            langs/dist/*.tar.gz
            langs/dist/languages.json
          if-no-files-found: error

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runs-on: macos-15
          # Cross-compiled: Apple's toolchain builds both architectures.
          - target: x86_64-apple-darwin
            runs-on: macos-15
          # The oldest supported Ubuntu sets the glibc mg needs: 2.35.
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-22.04-arm
    runs-on: ${{ matrix.runs-on }}
    env:
      # A release without the UI would be useless.
      MG_REQUIRE_UI: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      # A tag builds from scratch: whatever another run cached could end up
      # in a signed binary.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.ref_type != 'tag'
        with:
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: cargo build --release --locked -p mg --target ${{ matrix.target }}
      - name: Package
        # mg sits at the archive root, where packslip and mise look for it.
        env:
          COPYFILE_DISABLE: 1
        run: |
          mkdir dist
          tar czf dist/mg-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release mg
      - name: The binary runs
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          tar xzf dist/mg-${{ matrix.target }}.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/mg" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mg-${{ matrix.target }}
          path: dist/mg-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  sign:
    # Signs the archives built above with this workflow's identity. The job
    # can't write to the repository, so a compromised step here can't publish.
    if: github.ref_type == 'tag'
    needs: [build, langs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      bundle: ${{ steps.packslip.outputs.bundle }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mg-*
          path: dist
          merge-multiple: true
      - id: packslip
        uses: jdx/packslip@7b32cd29a9240927882ee18b3db1dcfd8e0328b4 # v1.7.0
        with:
          artifacts: dist/mg-*.tar.gz
          bin: mg
          upload: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packslip
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  release:
    # One `gh release create` with every asset, so the release never shows
    # without its signature and nothing is uploaded after it is published.
    if: github.ref_type == 'tag'
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes dist/*
